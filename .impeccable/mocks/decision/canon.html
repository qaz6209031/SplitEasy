<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#F2F2F7;color:#000;
font:17px/22px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
.status{height:54px;display:flex;align-items:center;justify-content:space-between;padding:14px 34px 0 46px;font-weight:600}
.nav{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#34C759}
.nav b{color:#000;font-weight:600}
.seg{margin:8px 16px 0;background:#E3E3E8;border-radius:9px;padding:2px;display:flex;height:32px}
.seg span{flex:1;text-align:center;font-size:13px;line-height:28px;font-weight:500}
.seg .on{background:#fff;border-radius:7px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sum{margin:16px;background:#fff;border-radius:12px;padding:16px}
.sum p{font-size:15px;color:#6C6C70}.sum b{font-size:28px;line-height:34px;color:#248A3D}
h3{font-size:13px;color:#6C6C70;padding:8px 32px 6px;font-weight:400;text-transform:uppercase}
.list{background:#fff;margin:0 16px;border-radius:12px}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px}
.row+.row{border-top:1px solid #E5E5EA}
.av{width:32px;height:32px;border-radius:50%;background:#D1D1D6;color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center}
.row .t{flex:1}.row .t small{display:block;font-size:13px;color:#6C6C70}
.g{color:#248A3D;font-weight:600}.o{color:#C93400;font-weight:600}
.foot{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 34px}
.btn{height:50px;border-radius:12px;background:#34C759;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
</style></head><body>
<div class="status"><span>9:41</span><span style="font-size:13px">●●● ▮</span></div>
<div class="nav"><span>‹ Groups</span><b>Tokyo Trip</b><span>Invite</span></div>
<div class="seg"><span>Expenses</span><span class="on">Balances</span></div>
<div class="sum"><p>You are owed</p><b>$295.50</b></div>
<h3>Balances</h3>
<div class="list">
  <div class="row"><div class="av" style="background:#5856D6">C</div><div class="t">You</div><span class="g">gets back $295.50</span></div>
  <div class="row"><div class="av" style="background:#FF9500">A</div><div class="t">Alice</div><span class="o">owes $96.30</span></div>
  <div class="row"><div class="av" style="background:#32ADE6">B</div><div class="t">Bob</div><span class="o">owes $199.20</span></div>
</div>
<h3>Suggested payments</h3>
<div class="list">
  <div class="row"><div class="t">Alice pays you<small>Paid Oct 14</small></div><span>$96.30</span></div>
  <div class="row"><div class="t">Bob pays you<small>Not yet paid</small></div><span>$199.20</span></div>
</div>
<div class="foot"><div class="btn">Settle Up</div></div>
</body></html>
