name: SplitEasy
options:
  bundleIdPrefix: com.kaichinh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.30.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: F8GUFSACTM
    CODE_SIGN_STYLE: Automatic
targets:
  SplitEasy:
    type: application
    platform: iOS
    sources: [SplitEasy]
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Secrets.xcconfig
    dependencies:
      - package: Supabase
    info:
      path: SplitEasy/Info.plist
      properties:
        CFBundleDisplayName: SplitEasy
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.kaichinh.spliteasy.auth
            CFBundleURLSchemes: [spliteasy]
        SupabaseHost: $(SUPABASE_HOST)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        # Empty in Release: DEV_ACCOUNT_PASSWORD only exists in the Debug xcconfig.
        DevAccountPassword: $(DEV_ACCOUNT_PASSWORD)
    entitlements:
      path: SplitEasy/SplitEasy.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaichinh.spliteasy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  SplitEasyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SplitEasyTests]
    dependencies:
      - target: SplitEasy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SplitEasy:
    build:
      targets:
        SplitEasy: all
        SplitEasyTests: [test]
    test:
      targets: [SplitEasyTests]
