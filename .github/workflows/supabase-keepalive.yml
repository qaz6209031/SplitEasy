# Supabase pauses free-plan projects after 7 days without activity. A tiny daily query keeps
# the database awake. The anonymous caller has no access to any rows, so no data is read.
# GitHub disables scheduled workflows after 60 days without commits; re-enable it in the Actions tab.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 16 * * *" # daily, 16:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          status=$(curl -sS -o response.json -w '%{http_code}' --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/groups?select=id&limit=1")
          echo "HTTP $status: $(cat response.json)"
          # The anon role has no grant on groups, so Postgres itself answers "permission denied"
          # (42501). That still proves the database is up and counts as activity.
          test "$status" = 200 || grep -q '"code":"42501"' response.json
