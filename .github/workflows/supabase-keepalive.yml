# Supabase pauses free-plan projects after 7 days without enough database activity
# (https://supabase.com/docs/guides/platform/free-project-pausing). Once a day this calls
# keep_alive() (supabase/migrations/20261016000000_keep_alive.sql), which updates one timestamp
# row: a real write, and no user data is touched.
# GitHub disables scheduled workflows after 60 days without commits; re-enable it in the Actions tab.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 16 * * *" # daily, 16:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write a heartbeat to the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl -sS --fail-with-body --retry 3 --retry-delay 10 -X POST \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}' \
            "$SUPABASE_URL/rest/v1/rpc/keep_alive"
